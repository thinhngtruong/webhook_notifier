# Alert rules (Prometheus). Tested by deploy/alerts_test.yml: make test-alerts.
#
# Dead letters are tickets, not pages: they come from partner-side causes
# (rejections, outages longer than the retry window), stay replayable for
# 30 days, and design.md says a single partner's errors never page. The
# thresholds are starting points to tune against real traffic.
groups:
  - name: webhook-dead-letters
    rules:
      - alert: WebhookDeadLetterRatioHigh
        # Postponed attempts (circuit open, host at its limit) never reached
        # the partner, so they count on neither side of the ratio.
        expr: |
          sum(rate(webhook_deliveries_total{outcome=~"dead|gone"}[30m]))
            /
          sum(rate(webhook_deliveries_total{outcome!="postponed"}[30m]))
            > 0.01
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: More than 1% of delivery attempts end in the dead-letter queue
          description: Check webhook_deliveries_total{outcome=~"dead|gone"} by cause. 4xx and 410 point at partner configuration; exhausted 5xx or timeouts at a partner outage longer than the retry window. Replay with notifier replay once fixed.
          runbook: docs/runbook.md#dead-letters

      - alert: WebhookDeadLetterQueueLarge
        # Every replica reports the same database-wide count: take one.
        expr: max(webhook_dead_deliveries) > 10000
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: The dead-letter queue holds more than 10,000 deliveries
          description: Dead deliveries are kept 30 days and replayable. Find the accounts and webhooks behind them (deliveries WHERE status = 'dead'), fix the cause, then replay with notifier replay.
          runbook: docs/runbook.md#dead-letters

      - alert: WebhookDeadLetterQueueGrowing
        expr: max(webhook_dead_deliveries) - max(webhook_dead_deliveries offset 1h) > 1000
        labels:
          severity: ticket
        annotations:
          summary: The dead-letter queue grew by more than 1,000 deliveries in the last hour
          description: Something new is failing permanently. Check webhook_deliveries_total{outcome=~"dead|gone"} by cause and the partner dashboard.
          runbook: docs/runbook.md#dead-letters

  # Events the dispatcher could not fan out never produced deliveries: that
  # is a durability miss, and design.md says any durability miss pages.
  - name: webhook-input-dead-letters
    rules:
      - alert: WebhookInputDeadLetters
        expr: max(webhook_input_dead_letters) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Events in the input dead-letter queue produced no deliveries
          description: The dispatcher dead-lettered events (malformed, or received too many times without an ack). Their webhooks were never called, which breaks the durability SLO. Inspect events_dead_letters, fix the cause, then requeue them.
          runbook: docs/runbook.md#input-dead-letters

  # Freshness SLO (design.md section 5): 99% of small-tier first attempts
  # within 5s. Error ratio = 1 - (attempts in the le="5" bucket / all), per
  # window, summed across replicas. Large accounts are measured by
  # throughput, not latency, so they are excluded.
  - name: webhook-freshness-slo-recording
    rules:
      - record: webhook:freshness_error_ratio:rate5m
        expr: 1 - sum(rate(webhook_first_attempt_latency_seconds_bucket{tier="small",le="5"}[5m])) / sum(rate(webhook_first_attempt_latency_seconds_count{tier="small"}[5m]))
      - record: webhook:freshness_error_ratio:rate30m
        expr: 1 - sum(rate(webhook_first_attempt_latency_seconds_bucket{tier="small",le="5"}[30m])) / sum(rate(webhook_first_attempt_latency_seconds_count{tier="small"}[30m]))
      - record: webhook:freshness_error_ratio:rate1h
        expr: 1 - sum(rate(webhook_first_attempt_latency_seconds_bucket{tier="small",le="5"}[1h])) / sum(rate(webhook_first_attempt_latency_seconds_count{tier="small"}[1h]))
      - record: webhook:freshness_error_ratio:rate6h
        expr: 1 - sum(rate(webhook_first_attempt_latency_seconds_bucket{tier="small",le="5"}[6h])) / sum(rate(webhook_first_attempt_latency_seconds_count{tier="small"}[6h]))
      - record: webhook:freshness_error_ratio:rate3d
        expr: 1 - sum(rate(webhook_first_attempt_latency_seconds_bucket{tier="small",le="5"}[3d])) / sum(rate(webhook_first_attempt_latency_seconds_count{tier="small"}[3d]))

  # Multi-window burn-rate alerts (budget 1%): a long window shows the burn
  # is real, a short one that it is still happening, so alerts stop soon
  # after recovery.
  - name: webhook-freshness-slo
    rules:
      - alert: WebhookFreshnessBudgetBurnFast
        expr: |
          webhook:freshness_error_ratio:rate1h > (14.4 * 0.01)
          and
          webhook:freshness_error_ratio:rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
          slo: freshness
        annotations:
          summary: Small accounts' webhooks are late, burning the freshness error budget fast
          description: More than 14.4x the 1% budget of small-tier first attempts later than 5s, over 1h and 5m. Check webhook_oldest_due_pending_age_seconds and the input queue age (ours), then partner latency (theirs).
          runbook: docs/runbook.md#freshness

      - alert: WebhookFreshnessBudgetBurnSlow
        expr: |
          webhook:freshness_error_ratio:rate6h > (6 * 0.01)
          and
          webhook:freshness_error_ratio:rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: page
          slo: freshness
        annotations:
          summary: Small accounts' webhooks are late, burning the freshness error budget
          description: More than 6x the 1% budget of small-tier first attempts later than 5s, over 6h and 30m. Check webhook_oldest_due_pending_age_seconds and the input queue age (ours), then partner latency (theirs).
          runbook: docs/runbook.md#freshness

      - alert: WebhookFreshnessBudgetBurnTicket
        expr: |
          webhook:freshness_error_ratio:rate3d > 0.01
          and
          webhook:freshness_error_ratio:rate6h > 0.01
        for: 1h
        labels:
          severity: ticket
          slo: freshness
        annotations:
          summary: The freshness error budget is being used faster than it refills
          description: Small-tier first attempts later than 5s are above the 1% budget over 3d and 6h. Look for slow growth in backlog or partner latency.
          runbook: docs/runbook.md#freshness
