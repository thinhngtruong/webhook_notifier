name: webhook-notifier

x-notifier: &notifier
  build: .
  image: webhook-notifier:dev
  command: ["notifier", "--dispatcher", "--worker", "--reaper"]
  environment:
    DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
    HTTP_ADDR: ":8080"
    # The fake partner is plain HTTP on the compose network. Production
    # keeps both checks on (HTTPS only, no internal addresses).
    ALLOW_HTTP: "true"
    ALLOW_PRIVATE_NETWORKS: "true"
    # Traces go to the trace viewer in the metrics profile (make up-metrics).
    # Without it the exporter fails quietly (one warning a minute).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_TRACES_SAMPLER_ARG: "1"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  # Longer than the 10s HTTP timeout so in-flight deliveries finish on stop.
  stop_grace_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
    ports:
      # Non-default host port so a local Postgres does not clash.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  notifier-1:
    <<: *notifier
    ports: ["8081:8080"]

  notifier-2:
    <<: *notifier
    ports: ["8082:8080"]

  producer:
    build: .
    image: webhook-notifier:dev
    command: ["producer", "--mode=steady", "--rate=20", "--accounts=50"]
    environment:
      DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
      PARTNER_URL: http://partner:9090
      WEBHOOK_SECRET: local-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_SAMPLER_ARG: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  partner:
    build: .
    image: webhook-notifier:dev
    command: ["partner", "--latency=50ms", "--error-rate=0.01"]
    environment:
      WEBHOOK_SECRET: local-secret
    ports: ["9090:9090"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["metrics"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9091:9090"]

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    profiles: ["metrics"]
    ports: ["16686:16686"] # trace UI; OTLP/HTTP on 4318 inside the network

volumes:
  pgdata:
