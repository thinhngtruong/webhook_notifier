name: webhook-notifier

x-notifier: &notifier
  build: .
  image: webhook-notifier:dev
  command: ["notifier", "--dispatcher", "--worker", "--reaper"]
  environment:
    DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
    HTTP_ADDR: ":8080"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
    ports:
      # Non-default host port so a local Postgres does not clash.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  notifier-1:
    <<: *notifier
    ports: ["8081:8080"]

  notifier-2:
    <<: *notifier
    ports: ["8082:8080"]

  producer:
    build: .
    image: webhook-notifier:dev
    command: ["producer"]
    depends_on: [notifier-1]
    restart: unless-stopped

  partner:
    build: .
    image: webhook-notifier:dev
    command: ["partner"]
    depends_on: [notifier-1]
    ports: ["9090:9090"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["metrics"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]

volumes:
  pgdata:
